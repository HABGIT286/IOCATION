<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOKO MUSIC - Luxury Music Player</title>
    <link rel="icon" type="image/jpeg" href="XX.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        :root {
            --primary-color: #00d4ff;
            --secondary-color: #0099ff;
            --accent-color: #ff6b35;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --rgb-1: #00d4ff;
            --rgb-2: #0099ff;
            --rgb-3: #ff6b35;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #000;
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            position: fixed;
            width: 100%;
        }

        /* Background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('X.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -1;
        }

        /* Welcome Screen */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .welcome-logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid transparent;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2), var(--rgb-3)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: logoPulse 2s ease-in-out infinite;
            margin-bottom: 40px;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 30px var(--rgb-1), 0 0 60px var(--rgb-2); }
            50% { box-shadow: 0 0 50px var(--rgb-2), 0 0 100px var(--rgb-3); }
        }

        .welcome-title {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2), var(--rgb-3));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 3s ease-in-out infinite;
            margin-bottom: 20px;
            text-align: center;
        }

        @keyframes textShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .welcome-subtitle {
            font-size: 18px;
            opacity: 0.8;
            margin-bottom: 40px;
            text-align: center;
        }

        .enter-btn {
            padding: 20px 60px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            border: none;
            border-radius: 50px;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            animation: btnPulse 2s ease-in-out infinite;
        }

        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(0, 212, 255, 0); }
        }

        .enter-btn:hover {
            transform: scale(1.1);
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid var(--rgb-1);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-image {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--rgb-1);
            animation: profileGlow 3s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .profile-image:hover {
            transform: scale(1.1) rotate(5deg);
        }

        @keyframes profileGlow {
            0%, 100% { box-shadow: 0 0 20px var(--rgb-1); }
            50% { box-shadow: 0 0 40px var(--rgb-2); }
        }

        .brand-name {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2), var(--rgb-3));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 3s ease-in-out infinite;
        }

        .clock-section {
            text-align: left;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        .clock-time {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
        }

        .clock-date {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            position: fixed;
            top: 80px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            z-index: 999;
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 12px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            border-radius: 25px;
            color: var(--text-color);
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .tab-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .tab-button:hover::before {
            left: 100%;
        }

        .tab-button.active {
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.5);
            border-color: transparent;
        }

        .tab-button:active {
            transform: scale(0.95);
        }

        /* Main Content - ثابت مع تمرير داخلي */
        .main-content {
            position: fixed;
            top: 180px;
            left: 0;
            right: 0;
            bottom: 150px;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--rgb-1) transparent;
        }

        .main-content::-webkit-scrollbar {
            width: 8px;
        }

        .main-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .main-content::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            border-radius: 10px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glass Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            margin-bottom: 20px;
            padding: 25px;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2), var(--rgb-3), var(--rgb-1));
            background-size: 400% 400%;
            z-index: -1;
            animation: rgbFlow 8s ease infinite;
            border-radius: 23px;
            opacity: 0.3;
        }

        @keyframes rgbFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.3);
        }

        /* Album Card */
        .album-card {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 30px;
            cursor: pointer;
            position: relative;
        }

        .album-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 20px;
            transition: all 0.5s;
        }

        .album-card:hover .album-image {
            transform: scale(1.05);
        }

        .album-info {
            padding: 20px;
            text-align: center;
        }

        .album-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .album-duration {
            font-size: 14px;
            opacity: 0.8;
        }

        /* Music Player */
        .music-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(30px);
            padding: 20px;
            border-top: 3px solid var(--rgb-1);
            z-index: 1000;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
        }

        .control-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            color: var(--text-color);
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            transform: scale(1.15);
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
            border-color: transparent;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .control-btn.play {
            width: 75px;
            height: 75px;
            font-size: 32px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            border: none;
            animation: playPulse 2s ease-in-out infinite;
        }

        @keyframes playPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.7); }
            50% { box-shadow: 0 0 0 25px rgba(0, 212, 255, 0); }
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .time-display {
            font-size: 13px;
            min-width: 45px;
            font-weight: 700;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--rgb-1), var(--rgb-2));
            border-radius: 10px;
            transition: width 0.1s;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--rgb-1);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: center;
        }

        .volume-container i {
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .volume-container i:hover {
            color: var(--rgb-1);
            transform: scale(1.2);
        }

        .volume-slider {
            width: 150px;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px var(--rgb-1);
        }

        /* Songs List with Mini Controls */
        .song-item {
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .song-item:hover {
            transform: translateX(-10px);
            background: rgba(0, 212, 255, 0.1);
        }

        .song-item:active {
            transform: scale(0.98);
        }

        .song-item.playing {
            background: rgba(0, 212, 255, 0.2);
            border: 2px solid var(--rgb-1);
        }

        .song-number {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            width: 35px;
        }

        .song-thumbnail {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--glass-border);
        }

        .song-details {
            flex: 1;
        }

        .song-name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .song-meta {
            font-size: 12px;
            opacity: 0.7;
        }

        /* Mini Controls */
        .mini-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .mini-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mini-btn:hover {
            transform: scale(1.2);
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            border-color: transparent;
        }

        .mini-btn:active {
            transform: scale(0.9);
        }

        /* Contact Section */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .contact-card {
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .contact-card:hover {
            transform: translateY(-10px);
        }

        .contact-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            animation: iconBounce 2s ease-in-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .contact-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .contact-handle {
            font-size: 16px;
            opacity: 0.8;
        }

        /* Themes Section */
        .themes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .theme-card {
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 2px solid var(--glass-border);
        }

        .theme-card:hover {
            transform: scale(1.05);
            border-color: var(--rgb-1);
        }

        .theme-preview {
            width: 100%;
            height: 120px;
            border-radius: 15px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(45deg, var(--theme-color-1), var(--theme-color-2));
        }

        .theme-name {
            font-size: 16px;
            font-weight: 700;
        }

        /* Dialog Modal */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10001;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .dialog-overlay.active {
            display: flex;
        }

        .dialog {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            border: 2px solid var(--rgb-1);
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: dialogSlide 0.4s ease;
        }

        @keyframes dialogSlide {
            from {
                transform: scale(0.8) translateY(-50px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .dialog-icon {
            font-size: 60px;
            color: var(--rgb-1);
            margin-bottom: 20px;
            animation: iconShake 0.5s ease;
        }

        @keyframes iconShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .dialog-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .dialog-message {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .dialog-btn {
            padding: 15px 40px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            border: none;
            border-radius: 25px;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .dialog-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.5);
        }

        .dialog-btn:active {
            transform: scale(0.95);
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10002;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 2px solid var(--rgb-1);
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: toastSlide 0.4s ease;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.3);
        }

        @keyframes toastSlide {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast.hiding {
            animation: toastHide 0.4s ease forwards;
        }

        @keyframes toastHide {
            to {
                transform: translateY(-100px);
                opacity: 0;
            }
        }

        .toast-icon {
            font-size: 30px;
            color: var(--rgb-1);
        }

        .toast-message {
            font-size: 16px;
            font-weight: 700;
        }

        /* Import Files Button */
        .import-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            border: none;
            border-radius: 20px;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            animation: importPulse 2s ease-in-out infinite;
        }

        @keyframes importPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.7); }
            50% { box-shadow: 0 0 0 15px rgba(0, 212, 255, 0); }
        }

        .import-btn:hover {
            transform: scale(1.05);
        }

        .import-btn:active {
            transform: scale(0.95);
        }

        /* Visualizer */
        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            height: 60px;
            margin: 20px 0;
        }

        .visualizer-bar {
            width: 10px;
            background: linear-gradient(to top, var(--rgb-1), var(--rgb-2));
            border-radius: 5px;
            animation: visualizerBounce 1s ease-in-out infinite;
        }

        .visualizer-bar:nth-child(1) { animation-delay: 0s; height: 20%; }
        .visualizer-bar:nth-child(2) { animation-delay: 0.1s; height: 60%; }
        .visualizer-bar:nth-child(3) { animation-delay: 0.2s; height: 40%; }
        .visualizer-bar:nth-child(4) { animation-delay: 0.3s; height: 80%; }
        .visualizer-bar:nth-child(5) { animation-delay: 0.4s; height: 30%; }
        .visualizer-bar:nth-child(6) { animation-delay: 0.5s; height: 70%; }
        .visualizer-bar:nth-child(7) { animation-delay: 0.6s; height: 50%; }

        @keyframes visualizerBounce {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }

        /* Now Playing Indicator */
        .now-playing {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            animation: nowPlayingPulse 2s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes nowPlayingPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.95); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .brand-name {
                font-size: 20px;
            }
            
            .clock-time {
                font-size: 18px;
            }
            
            .nav-tabs {
                gap: 5px;
                padding: 10px;
            }
            
            .tab-button {
                padding: 10px 20px;
                font-size: 14px;
            }
            
            .main-content {
                top: 160px;
            }
            
            .welcome-title {
                font-size: 32px;
            }
            
            .welcome-logo {
                width: 120px;
                height: 120px;
            }
        }

        /* Prevent text selection */
        * {
            -webkit-touch-callout: none;
        }

        /* Hidden file input */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Welcome Screen -->
    <div class="welcome-screen" id="welcomeScreen">
        <img src="XX.jpg" alt="Logo" class="welcome-logo">
        <h1 class="welcome-title">SOKO MUSIC</h1>
        <p class="welcome-subtitle">تجربة موسيقية فاخرة</p>
        <button class="enter-btn" onclick="enterSite()">
            <i class="fas fa-play"></i> دخول
        </button>
    </div>

    <!-- Background -->
    <div class="background"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo-section">
            <img src="XX.jpg" alt="Profile" class="profile-image">
            <h1 class="brand-name">SOKO MUSIC</h1>
        </div>
        <div class="clock-section">
            <div class="clock-time" id="clockTime">12:00:00 م</div>
            <div class="clock-date" id="clockDate">الجمعة، 31 يوليو 2026</div>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-button active" data-tab="home">
            <i class="fas fa-home"></i> الرئيسية
        </button>
        <button class="tab-button" data-tab="songs">
            <i class="fas fa-music"></i> الأغاني
        </button>
        <button class="tab-button" data-tab="contact">
            <i class="fas fa-address-card"></i> تواصل
        </button>
        <button class="tab-button" data-tab="themes">
            <i class="fas fa-palette"></i> ثيمات
        </button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Home Tab -->
        <div class="tab-content active" id="home">
            <div class="album-card glass-card" id="albumCard">
                <div class="now-playing">🎵 جاري التشغيل</div>
                <img src="1.jpg" alt="Album" class="album-image" id="albumImage">
                <div class="album-info">
                    <h3 class="album-title" id="albumTitle">الأغنية 1</h3>
                    <p class="album-duration" id="albumDuration">03:45</p>
                </div>
            </div>
            
            <div class="glass-card">
                <div class="visualizer" id="visualizer" style="display: none;">
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                </div>
            </div>
        </div>

        <!-- Songs Tab -->
        <div class="tab-content" id="songs">
            <button class="import-btn" onclick="importFiles()">
                <i class="fas fa-folder-open"></i>
                استيراد أغاني من الجهاز
            </button>
            <div id="songsList"></div>
        </div>

        <!-- Contact Tab -->
        <div class="tab-content" id="contact">
            <div class="contact-grid">
                <div class="glass-card contact-card" onclick="openLink('https://tiktok.com/@yourusername')">
                    <div class="contact-icon">
                        <i class="fab fa-tiktok"></i>
                    </div>
                    <h3 class="contact-name">تيك توك</h3>
                    <p class="contact-handle">@yourusername</p>
                </div>
                
                <div class="glass-card contact-card" onclick="openLink('https://discord.com/users/yourid')">
                    <div class="contact-icon">
                        <i class="fab fa-discord"></i>
                    </div>
                    <h3 class="contact-name">ديسكورد</h3>
                    <p class="contact-handle">YourUsername#1234</p>
                </div>
                
                <div class="glass-card contact-card" onclick="openLink('https://open.spotify.com/user/yourid')">
                    <div class="contact-icon">
                        <i class="fab fa-spotify"></i>
                    </div>
                    <h3 class="contact-name">سبوتيفاي</h3>
                    <p class="contact-handle">yourusername</p>
                </div>
            </div>
        </div>

        <!-- Themes Tab -->
        <div class="tab-content" id="themes">
            <div class="themes-grid">
                <div class="theme-card" onclick="changeTheme('#00d4ff', '#0099ff')">
                    <div class="theme-preview" style="--theme-color-1: #00d4ff; --theme-color-2: #0099ff;"></div>
                    <h3 class="theme-name">أزرق سماوي</h3>
                </div>
                
                <div class="theme-card" onclick="changeTheme('#ff6b35', '#ff9500')">
                    <div class="theme-preview" style="--theme-color-1: #ff6b35; --theme-color-2: #ff9500;"></div>
                    <h3 class="theme-name">برتقالي ناري</h3>
                </div>
                
                <div class="theme-card" onclick="changeTheme('#06ffa5', '#00d4ff')">
                    <div class="theme-preview" style="--theme-color-1: #06ffa5; --theme-color-2: #00d4ff;"></div>
                    <h3 class="theme-name">أخضر سماوي</h3>
                </div>
                
                <div class="theme-card" onclick="changeTheme('#9d4edd', '#c77dff')">
                    <div class="theme-preview" style="--theme-color-1: #9d4edd; --theme-color-2: #c77dff;"></div>
                    <h3 class="theme-name">بنفسجي فاخر</h3>
                </div>
                
                <div class="theme-card" onclick="changeTheme('#ff006e', '#ff4d00')">
                    <div class="theme-preview" style="--theme-color-1: #ff006e; --theme-color-2: #ff4d00;"></div>
                    <h3 class="theme-name">أحمر برتقالي</h3>
                </div>
                
                <div class="theme-card" onclick="changeTheme('#00f5d4', '#00bbf9')">
                    <div class="theme-preview" style="--theme-color-1: #00f5d4; --theme-color-2: #00bbf9;"></div>
                    <h3 class="theme-name">تركواز أزرق</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Music Player -->
    <div class="music-player">
        <div class="player-controls">
            <button class="control-btn" id="prevBtn" onclick="previousSong()">
                <i class="fas fa-step-backward"></i>
            </button>
            <button class="control-btn play" id="playBtn" onclick="togglePlay()">
                <i class="fas fa-play" id="playIcon"></i>
            </button>
            <button class="control-btn" id="nextBtn" onclick="nextSong()">
                <i class="fas fa-step-forward"></i>
            </button>
        </div>
        
        <div class="progress-container">
            <span class="time-display" id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar" onclick="seek(event)">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <span class="time-display" id="duration">0:00</span>
        </div>
        
        <div class="volume-container">
            <i class="fas fa-volume-up" id="volumeIcon" onclick="toggleMute()"></i>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" onchange="changeVolume(this.value)">
        </div>
    </div>

    <!-- Dialog Modal -->
    <div class="dialog-overlay" id="dialogOverlay">
        <div class="dialog">
            <div class="dialog-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 class="dialog-title" id="dialogTitle">تنبيه</h3>
            <p class="dialog-message" id="dialogMessage">رسالة التنبيه</p>
            <button class="dialog-btn" onclick="closeDialog()">حسناً</button>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Audio Element -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <!-- File Input -->
    <input type="file" id="fileInput" multiple accept="audio/*" onchange="handleFiles(event)">

    <script>
        // Songs Data
        const songs = [
            { id: 1, name: 'الأغنية 1', duration: '03:45', image: '1.jpg', file: '1.mp3' },
            { id: 2, name: 'الأغنية 2', duration: '04:12', image: '2.jpg', file: '2.mp3' },
            { id: 3, name: 'الأغنية 3', duration: '03:28', image: '3.jpg', file: '3.mp3' },
            { id: 4, name: 'الأغنية 4', duration: '05:01', image: '4.jpg', file: '4.mp3' },
            { id: 5, name: 'الأغنية 5', duration: '03:55', image: '5.jpg', file: '5.mp3' },
            { id: 6, name: 'الأغنية 6', duration: '04:30', image: '6.jpg', file: '6.mp3' },
            { id: 7, name: 'الأغنية 7', duration: '03:15', image: '7.jpg', file: '7.mp3' },
            { id: 8, name: 'الأغنية 8', duration: '04:45', image: '8.jpg', file: '8.mp3' },
            { id: 9, name: 'الأغنية 9', duration: '03:38', image: '9.jpg', file: '9.mp3' },
            { id: 10, name: 'الأغنية 10', duration: '04:20', image: '10.jpg', file: '10.mp3' }
        ];

        let currentSongIndex = 0;
        let isPlaying = false;
        let isMuted = false;
        let previousVolume = 0.7;
        let importedSongs = [];

        const audio = document.getElementById('audioPlayer');
        const playIcon = document.getElementById('playIcon');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const albumImage = document.getElementById('albumImage');
        const albumTitle = document.getElementById('albumTitle');
        const albumDuration = document.getElementById('albumDuration');
        const visualizer = document.getElementById('visualizer');

        // Enter Site
        function enterSite() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            audio.volume = 0.7;
        }

        // Initialize
        window.onload = function() {
            updateClock();
            setInterval(updateClock, 1000);
            renderSongsList();
            loadSong(0);
            setupEventListeners();
            setupTabNavigation();
            setupClickEffects();
        };

        // Clock
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'م' : 'ص';
            const displayHours = hours % 12 || 12;
            
            document.getElementById('clockTime').textContent = 
                `${displayHours}:${minutes}:${seconds} ${ampm}`;
            
            const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            
            document.getElementById('clockDate').textContent = 
                `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }

        // Tab Navigation
        function setupTabNavigation() {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabId = btn.getAttribute('data-tab');
                    
                    tabButtons.forEach(b => b.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    document.getElementById(tabId).classList.add('active');
                });
            });
        }

        // Render Songs List
        function renderSongsList() {
            const container = document.getElementById('songsList');
            const allSongs = [...songs, ...importedSongs];
            
            container.innerHTML = allSongs.map((song, index) => `
                <div class="glass-card song-item" onclick="playSong(${index})" id="song-${index}">
                    <div class="song-number">${index + 1}</div>
                    <img src="${song.image || 'XX.jpg'}" alt="${song.name}" class="song-thumbnail">
                    <div class="song-details">
                        <h3 class="song-name">${song.name}</h3>
                        <p class="song-meta">${song.duration || 'غير محدد'}</p>
                    </div>
                    <div class="mini-controls">
                        <button class="mini-btn" onclick="event.stopPropagation(); adjustVolume(${index}, 0.1)" title="رفع الصوت">
                            <i class="fas fa-volume-up"></i>
                        </button>
                        <button class="mini-btn" onclick="event.stopPropagation(); adjustVolume(${index}, -0.1)" title="تخفيض الصوت">
                            <i class="fas fa-volume-down"></i>
                        </button>
                        <button class="mini-btn" onclick="event.stopPropagation(); skipForward(${index})" title="تقديم">
                            <i class="fas fa-forward"></i>
                        </button>
                        <button class="mini-btn" onclick="event.stopPropagation(); skipBackward(${index})" title="رجوع">
                            <i class="fas fa-backward"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Load Song
        function loadSong(index) {
            const allSongs = [...songs, ...importedSongs];
            if (index >= allSongs.length) return;
            
            currentSongIndex = index;
            const song = allSongs[index];
            
            audio.src = song.file;
            albumImage.src = song.image || 'XX.jpg';
            albumTitle.textContent = song.name;
            albumDuration.textContent = song.duration || 'غير محدد';
            
            // Update active song in list
            document.querySelectorAll('.song-item').forEach((item, i) => {
                if (i === index) {
                    item.classList.add('playing');
                } else {
                    item.classList.remove('playing');
                }
            });
        }

        // Play Song
        function playSong(index) {
            const allSongs = [...songs, ...importedSongs];
            if (index >= allSongs.length) return;
            
            loadSong(index);
            play();
        }

        // Toggle Play
        function togglePlay() {
            if (isPlaying) {
                pause();
            } else {
                play();
            }
        }

        function play() {
            audio.play().then(() => {
                isPlaying = true;
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                visualizer.style.display = 'flex';
            }).catch(error => {
                console.error('Error playing audio:', error);
                showToast('تعذر تشغيل الأغنية', 'error');
            });
        }

        function pause() {
            audio.pause();
            isPlaying = false;
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
            visualizer.style.display = 'none';
        }

        // Next/Previous
        function nextSong() {
            const allSongs = [...songs, ...importedSongs];
            let nextIndex = currentSongIndex + 1;
            if (nextIndex >= allSongs.length) nextIndex = 0;
            playSong(nextIndex);
        }

        function previousSong() {
            const allSongs = [...songs, ...importedSongs];
            let prevIndex = currentSongIndex - 1;
            if (prevIndex < 0) prevIndex = allSongs.length - 1;
            playSong(prevIndex);
        }

        // Mini Controls
        function adjustVolume(index, change) {
            const newVolume = Math.max(0, Math.min(1, audio.volume + change));
            audio.volume = newVolume;
            document.getElementById('volumeSlider').value = newVolume * 100;
            updateVolumeIcon(newVolume);
            showToast(`تم ${change > 0 ? 'رفع' : 'تخفيض'} الصوت`, 'success');
        }

        function skipForward(index) {
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
            showToast('تم التقديم 10 ثواني', 'success');
        }

        function skipBackward(index) {
            audio.currentTime = Math.max(0, audio.currentTime - 10);
            showToast('تم الرجوع 10 ثواني', 'success');
        }

        // Audio Events
        function setupEventListeners() {
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
            });
            audio.addEventListener('ended', nextSong);
            audio.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                showToast('ملف الأغنية غير موجود', 'error');
            });
        }

        function updateProgress() {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
        }

        function seek(event) {
            const progressBar = document.getElementById('progressBar');
            const clickPosition = event.offsetX / progressBar.offsetWidth;
            audio.currentTime = clickPosition * audio.duration;
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Volume Control
        function changeVolume(value) {
            audio.volume = value / 100;
            updateVolumeIcon(audio.volume);
        }

        function updateVolumeIcon(volume) {
            const icon = document.getElementById('volumeIcon');
            if (volume == 0) {
                icon.classList.remove('fa-volume-up');
                icon.classList.add('fa-volume-mute');
            } else {
                icon.classList.remove('fa-volume-mute');
                icon.classList.add('fa-volume-up');
            }
        }

        function toggleMute() {
            const slider = document.getElementById('volumeSlider');
            
            if (isMuted) {
                audio.volume = previousVolume;
                isMuted = false;
                updateVolumeIcon(previousVolume);
                slider.value = previousVolume * 100;
            } else {
                previousVolume = audio.volume;
                audio.volume = 0;
                isMuted = true;
                updateVolumeIcon(0);
                slider.value = 0;
            }
        }

        // Theme Change
        function changeTheme(color1, color2) {
            document.documentElement.style.setProperty('--rgb-1', color1);
            document.documentElement.style.setProperty('--rgb-2', color2);
            showToast('تم تغيير الثيم بنجاح', 'success');
        }

        // Open Link
        function openLink(url) {
            window.open(url, '_blank');
        }

        // Click Effects
        function setupClickEffects() {
            document.addEventListener('click', (e) => {
                const effect = document.createElement('div');
                effect.className = 'click-effect';
                effect.style.left = e.pageX - 15 + 'px';
                effect.style.top = e.pageY - 15 + 'px';
                document.body.appendChild(effect);
                
                setTimeout(() => effect.remove(), 600);
            });
        }

        // Dialog
        function showDialog(title, message) {
            document.getElementById('dialogTitle').textContent = title;
            document.getElementById('dialogMessage').textContent = message;
            document.getElementById('dialogOverlay').classList.add('active');
        }

        function closeDialog() {
            document.getElementById('dialogOverlay').classList.remove('active');
        }

        // Toast
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';
            const color = type === 'error' ? '#ff006e' : '#00d4ff';
            
            toast.innerHTML = `
                <div class="toast-icon" style="color: ${color}">
                    <i class="fas ${icon}"></i>
                </div>
                <div class="toast-message">${message}</div>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // Import Files
        function importFiles() {
            document.getElementById('fileInput').click();
        }

        function handleFiles(event) {
            const files = Array.from(event.target.files);
            
            if (files.length === 0) {
                showToast('لم يتم اختيار أي ملفات', 'error');
                return;
            }
            
            files.forEach((file, index) => {
                if (file.type.startsWith('audio/')) {
                    const url = URL.createObjectURL(file);
                    const songName = file.name.replace(/\.[^/.]+$/, '');
                    
                    importedSongs.push({
                        id: songs.length + importedSongs.length + 1,
                        name: songName,
                        duration: 'غير محدد',
                        image: 'XX.jpg',
                        file: url
                    });
                }
            });
            
            renderSongsList();
            showToast(`تم استيراد ${files.length} أغنية بنجاح`, 'success');
        }

        // Prevent Text Selection and Context Menu
        document.addEventListener('selectstart', (e) => e.preventDefault());
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('dragstart', (e) => e.preventDefault());

        // Auto-rotate album in home section
        let albumIndex = 0;
        setInterval(() => {
            if (document.getElementById('home').classList.contains('active') && !isPlaying) {
                albumIndex = (albumIndex + 1) % songs.length;
                const song = songs[albumIndex];
                albumImage.src = song.image;
                albumTitle.textContent = song.name;
                albumDuration.textContent = song.duration;
            }
        }, 5000);
    </script>
</body>
</html>
