<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOKO MUSIC - Luxury Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        :root {
            --primary-color: #ff006e;
            --secondary-color: #8338ec;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --rgb-1: #ff006e;
            --rgb-2: #8338ec;
            --rgb-3: #3a86ff;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #000;
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('X.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -2;
            filter: brightness(0.3);
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 0, 110, 0.3), rgba(131, 56, 236, 0.3));
            z-index: -1;
            animation: backgroundPulse 10s ease-in-out infinite;
        }

        @keyframes backgroundPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
        }

        .top-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, var(--rgb-1), var(--rgb-2), var(--rgb-3), var(--rgb-1));
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbBorder 5s ease infinite;
            opacity: 0.7;
        }

        @keyframes rgbBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-image {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid transparent;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: profileGlow 3s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .profile-image:hover {
            transform: scale(1.1) rotate(5deg);
        }

        @keyframes profileGlow {
            0%, 100% { box-shadow: 0 0 20px var(--rgb-1); }
            50% { box-shadow: 0 0 40px var(--rgb-2); }
        }

        .brand-name {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2), var(--rgb-3));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 0, 110, 0.5);
        }

        @keyframes textShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .clock-section {
            text-align: left;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        .clock-time {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
            animation: clockPulse 1s ease-in-out infinite;
        }

        @keyframes clockPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .clock-date {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            position: fixed;
            top: 80px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            z-index: 999;
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 12px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            border-radius: 25px;
            color: var(--text-color);
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .tab-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .tab-button:hover::before {
            left: 100%;
        }

        .tab-button.active {
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 0, 110, 0.5);
        }

        .tab-button:active {
            transform: scale(0.95);
        }

        /* Main Content */
        .main-content {
            margin-top: 180px;
            padding: 20px;
            min-height: calc(100vh - 180px);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glass Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2), var(--rgb-3), var(--rgb-1));
            background-size: 400% 400%;
            z-index: -1;
            animation: rgbFlow 8s ease infinite;
            border-radius: 25px;
        }

        @keyframes rgbFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 60px rgba(255, 0, 110, 0.4);
        }

        /* Album Card */
        .album-card {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 30px;
            cursor: pointer;
            position: relative;
        }

        .album-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 20px;
            transition: all 0.5s;
        }

        .album-card:hover .album-image {
            transform: scale(1.05);
        }

        .album-info {
            padding: 20px;
            text-align: center;
        }

        .album-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 10px var(--rgb-1); }
            50% { text-shadow: 0 0 20px var(--rgb-2), 0 0 30px var(--rgb-1); }
        }

        .album-duration {
            font-size: 14px;
            opacity: 0.8;
        }

        /* Music Player */
        .music-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(30px);
            padding: 20px;
            border-top: 3px solid transparent;
            background-clip: padding-box;
            z-index: 1000;
        }

        .music-player::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--rgb-1), var(--rgb-2), var(--rgb-3));
            animation: rgbLine 3s linear infinite;
        }

        @keyframes rgbLine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.6);
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .control-btn.play {
            width: 70px;
            height: 70px;
            font-size: 30px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            border: none;
            animation: playPulse 2s ease-in-out infinite;
        }

        @keyframes playPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 0, 110, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(255, 0, 110, 0); }
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .time-display {
            font-size: 12px;
            min-width: 40px;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--rgb-1), var(--rgb-2));
            border-radius: 10px;
            transition: width 0.1s;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px var(--rgb-1);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .volume-slider {
            width: 150px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--rgb-1);
        }

        /* Songs List */
        .song-item {
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .song-item:hover {
            transform: translateX(-10px);
            background: rgba(255, 255, 255, 0.15);
        }

        .song-item:active {
            transform: scale(0.98);
        }

        .song-number {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            width: 40px;
        }

        .song-thumbnail {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
        }

        .song-details {
            flex: 1;
        }

        .song-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
            animation: flickerText 3s ease-in-out infinite;
        }

        @keyframes flickerText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .song-meta {
            font-size: 14px;
            opacity: 0.7;
        }

        /* Contact Section */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .contact-card {
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .contact-card:hover {
            transform: translateY(-10px) rotateY(10deg);
        }

        .contact-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: iconBounce 2s ease-in-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .contact-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .contact-handle {
            font-size: 14px;
            opacity: 0.8;
        }

        /* Themes Section */
        .themes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .theme-card {
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .theme-card:hover {
            transform: scale(1.05);
        }

        .theme-preview {
            width: 100%;
            height: 150px;
            border-radius: 15px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .theme-preview::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, var(--theme-color-1), var(--theme-color-2));
            animation: themeFlow 5s ease infinite;
        }

        @keyframes themeFlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .theme-name {
            font-size: 16px;
            font-weight: 700;
        }

        /* Click Effect */
        .click-effect {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--rgb-1), transparent);
            pointer-events: none;
            animation: clickRipple 0.6s ease-out;
        }

        @keyframes clickRipple {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }

        /* Now Playing Indicator */
        .now-playing {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(45deg, var(--rgb-1), var(--rgb-2));
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            animation: nowPlayingPulse 2s ease-in-out infinite;
        }

        @keyframes nowPlayingPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .brand-name {
                font-size: 20px;
            }
            
            .clock-time {
                font-size: 18px;
            }
            
            .nav-tabs {
                gap: 5px;
            }
            
            .tab-button {
                padding: 10px 20px;
                font-size: 14px;
            }
            
            .main-content {
                margin-top: 160px;
            }
        }

        /* Loading Animation */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid transparent;
            border-top-color: var(--rgb-1);
            border-right-color: var(--rgb-2);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Visualizer */
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 50px;
            margin: 20px 0;
        }

        .visualizer-bar {
            width: 8px;
            background: linear-gradient(to top, var(--rgb-1), var(--rgb-2));
            border-radius: 5px;
            animation: visualizerBounce 1s ease-in-out infinite;
        }

        .visualizer-bar:nth-child(1) { animation-delay: 0s; height: 20%; }
        .visualizer-bar:nth-child(2) { animation-delay: 0.1s; height: 60%; }
        .visualizer-bar:nth-child(3) { animation-delay: 0.2s; height: 40%; }
        .visualizer-bar:nth-child(4) { animation-delay: 0.3s; height: 80%; }
        .visualizer-bar:nth-child(5) { animation-delay: 0.4s; height: 30%; }

        @keyframes visualizerBounce {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <!-- Background -->
    <div class="background"></div>
    <div class="background-overlay"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo-section">
            <img src="XX.jpg" alt="Profile" class="profile-image" id="profileImage">
            <h1 class="brand-name">SOKO MUSIC</h1>
        </div>
        <div class="clock-section">
            <div class="clock-time" id="clockTime">12:00:00 م</div>
            <div class="clock-date" id="clockDate">الجمعة، 31 يوليو 2026</div>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-button active" data-tab="home">
            <i class="fas fa-home"></i> الرئيسية
        </button>
        <button class="tab-button" data-tab="songs">
            <i class="fas fa-music"></i> الأغاني
        </button>
        <button class="tab-button" data-tab="contact">
            <i class="fas fa-address-card"></i> تواصل
        </button>
        <button class="tab-button" data-tab="themes">
            <i class="fas fa-palette"></i> ثيمات
        </button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Home Tab -->
        <div class="tab-content active" id="home">
            <div class="album-card glass-card" id="albumCard">
                <div class="now-playing">جاري التشغيل</div>
                <img src="1.jpg" alt="Album" class="album-image" id="albumImage">
                <div class="album-info">
                    <h3 class="album-title" id="albumTitle">الأغنية 1</h3>
                    <p class="album-duration" id="albumDuration">03:45</p>
                </div>
            </div>
            
            <div class="glass-card" style="padding: 20px; margin-top: 30px;">
                <div class="visualizer" id="visualizer" style="display: none;">
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                    <div class="visualizer-bar"></div>
                </div>
            </div>
        </div>

        <!-- Songs Tab -->
        <div class="tab-content" id="songs">
            <div id="songsList"></div>
        </div>

        <!-- Contact Tab -->
        <div class="tab-content" id="contact">
            <div class="contact-grid">
                <div class="glass-card contact-card" onclick="openLink('https://www.tiktok.com/@40.tnt?_r=1&_t=ZS-98TOUkL1S2J')">
                    <div class="contact-icon">
                        <i class="fab fa-tiktok"></i>
                    </div>
                    <h3 class="contact-name">تيك توك</h3>
                    <p class="contact-handle">@yourusername</p>
                </div>
                
                <div class="glass-card contact-card" onclick="openLink('https://discord.com/users/1487837632716079344')">
                    <div class="contact-icon">
                        <i class="fab fa-discord"></i>
                    </div>
                    <h3 class="contact-name">ديسكورد</h3>
                    <p class="contact-handle">YourUsername#1234</p>
                </div>
                
                <div class="glass-card contact-card" onclick="openLink('https://open.spotify.com/user/31rcvnqojr2aqaulzb77jqv5u7de?si=OpPQgGIhRyidL8-Q4QqEaw&utm_source=copy-link')">
                    <div class="contact-icon">
                        <i class="fab fa-spotify"></i>
                    </div>
                    <h3 class="contact-name">سبوتيفاي</h3>
                    <p class="contact-handle">yourusername</p>
                </div>
            </div>
        </div>

        <!-- Themes Tab -->
        <div class="tab-content" id="themes">
            <div class="themes-grid">
                <div class="glass-card theme-card" onclick="changeTheme('#ff006e', '#8338ec')">
                    <div class="theme-preview" style="--theme-color-1: #ff006e; --theme-color-2: #8338ec;"></div>
                    <h3 class="theme-name">أحمر بنفسجي</h3>
                </div>
                
                <div class="glass-card theme-card" onclick="changeTheme('#06ffa5', '#00d4ff')">
                    <div class="theme-preview" style="--theme-color-1: #06ffa5; --theme-color-2: #00d4ff;"></div>
                    <h3 class="theme-name">أخضر سماوي</h3>
                </div>
                
                <div class="glass-card theme-card" onclick="changeTheme('#ff006e', '#ff4d00')">
                    <div class="theme-preview" style="--theme-color-1: #ff006e; --theme-color-2: #ff4d00;"></div>
                    <h3 class="theme-name">وردي أحمر</h3>
                </div>
                
                <div class="glass-card theme-card" onclick="changeTheme('#06ffa5', '#8338ec')">
                    <div class="theme-preview" style="--theme-color-1: #06ffa5; --theme-color-2: #8338ec;"></div>
                    <h3 class="theme-name">أخضر بنفسجي</h3>
                </div>
                
                <div class="glass-card theme-card" onclick="changeTheme('#ff9500', '#800000')">
                    <div class="theme-preview" style="--theme-color-1: #ff9500; --theme-color-2: #800000;"></div>
                    <h3 class="theme-name">برتقالي ماروني</h3>
                </div>
                
                <div class="glass-card theme-card" onclick="changeTheme('#00d4ff', '#ff006e')">
                    <div class="theme-preview" style="--theme-color-1: #00d4ff; --theme-color-2: #ff006e;"></div>
                    <h3 class="theme-name">سماوي أحمر</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Music Player -->
    <div class="music-player">
        <div class="player-controls">
            <button class="control-btn" id="prevBtn" onclick="previousSong()">
                <i class="fas fa-step-backward"></i>
            </button>
            <button class="control-btn play" id="playBtn" onclick="togglePlay()">
                <i class="fas fa-play" id="playIcon"></i>
            </button>
            <button class="control-btn" id="nextBtn" onclick="nextSong()">
                <i class="fas fa-step-forward"></i>
            </button>
        </div>
        
        <div class="progress-container">
            <span class="time-display" id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar" onclick="seek(event)">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <span class="time-display" id="duration">0:00</span>
        </div>
        
        <div class="volume-container">
            <i class="fas fa-volume-up"></i>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" onchange="changeVolume(this.value)">
            <i class="fas fa-volume-mute" id="muteIcon" onclick="toggleMute()" style="cursor: pointer;"></i>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <script>
        // Songs Data
        const songs = [
            { id: 1, name: 'الأغنية 1', duration: '03:45', image: '1.jpg', file: '1.mp3' },
            { id: 2, name: 'الأغنية 2', duration: '04:12', image: '2.jpg', file: '2.mp3' },
            { id: 3, name: 'الأغنية 3', duration: '03:28', image: '3.jpg', file: '3.mp3' },
            { id: 4, name: 'الأغنية 4', duration: '05:01', image: '4.jpg', file: '4.mp3' },
            { id: 5, name: 'الأغنية 5', duration: '03:55', image: '5.jpg', file: '5.mp3' },
            { id: 6, name: 'الأغنية 6', duration: '04:30', image: '6.jpg', file: '6.mp3' },
            { id: 7, name: 'الأغنية 7', duration: '03:15', image: '7.jpg', file: '7.mp3' },
            { id: 8, name: 'الأغنية 8', duration: '04:45', image: '8.jpg', file: '8.mp3' },
            { id: 9, name: 'الأغنية 9', duration: '03:38', image: '9.jpg', file: '9.mp3' },
            { id: 10, name: 'الأغنية 10', duration: '04:20', image: '10.jpg', file: '10.mp3' }
        ];

        let currentSongIndex = 0;
        let isPlaying = false;
        let isMuted = false;
        let previousVolume = 0.7;

        const audio = document.getElementById('audioPlayer');
        const playIcon = document.getElementById('playIcon');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const albumImage = document.getElementById('albumImage');
        const albumTitle = document.getElementById('albumTitle');
        const albumDuration = document.getElementById('albumDuration');
        const visualizer = document.getElementById('visualizer');

        // Initialize
        window.onload = function() {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1500);
            
            updateClock();
            setInterval(updateClock, 1000);
            renderSongsList();
            loadSong(0);
            setupEventListeners();
            setupTabNavigation();
            setupClickEffects();
        };

        // Clock
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'م' : 'ص';
            const displayHours = hours % 12 || 12;
            
            document.getElementById('clockTime').textContent = 
                `${displayHours}:${minutes}:${seconds} ${ampm}`;
            
            const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            
            document.getElementById('clockDate').textContent = 
                `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }

        // Tab Navigation
        function setupTabNavigation() {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabId = btn.getAttribute('data-tab');
                    
                    tabButtons.forEach(b => b.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    document.getElementById(tabId).classList.add('active');
                });
            });
        }

        // Render Songs List
        function renderSongsList() {
            const container = document.getElementById('songsList');
            container.innerHTML = songs.map((song, index) => `
                <div class="glass-card song-item" onclick="playSong(${index})">
                    <div class="song-number">${index + 1}</div>
                    <img src="${song.image}" alt="${song.name}" class="song-thumbnail">
                    <div class="song-details">
                        <h3 class="song-name">${song.name}</h3>
                        <p class="song-meta">${song.duration}</p>
                    </div>
                    <i class="fas fa-play" style="font-size: 20px; opacity: 0.7;"></i>
                </div>
            `).join('');
        }

        // Load Song
        function loadSong(index) {
            currentSongIndex = index;
            const song = songs[index];
            
            audio.src = song.file;
            albumImage.src = song.image;
            albumTitle.textContent = song.name;
            albumDuration.textContent = song.duration;
            
            // Update active song in list
            document.querySelectorAll('.song-item').forEach((item, i) => {
                if (i === index) {
                    item.style.background = 'rgba(255, 0, 110, 0.3)';
                } else {
                    item.style.background = '';
                }
            });
        }

        // Play Song
        function playSong(index) {
            loadSong(index);
            play();
        }

        // Toggle Play
        function togglePlay() {
            if (isPlaying) {
                pause();
            } else {
                play();
            }
        }

        function play() {
            audio.play();
            isPlaying = true;
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
            visualizer.style.display = 'flex';
        }

        function pause() {
            audio.pause();
            isPlaying = false;
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
            visualizer.style.display = 'none';
        }

        // Next/Previous
        function nextSong() {
            let nextIndex = currentSongIndex + 1;
            if (nextIndex >= songs.length) nextIndex = 0;
            playSong(nextIndex);
        }

        function previousSong() {
            let prevIndex = currentSongIndex - 1;
            if (prevIndex < 0) prevIndex = songs.length - 1;
            playSong(prevIndex);
        }

        // Audio Events
        function setupEventListeners() {
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
            });
            audio.addEventListener('ended', nextSong);
        }

        function updateProgress() {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
        }

        function seek(event) {
            const progressBar = document.getElementById('progressBar');
            const clickPosition = event.offsetX / progressBar.offsetWidth;
            audio.currentTime = clickPosition * audio.duration;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Volume Control
        function changeVolume(value) {
            audio.volume = value / 100;
            if (value == 0) {
                document.getElementById('muteIcon').classList.remove('fa-volume-up');
                document.getElementById('muteIcon').classList.add('fa-volume-mute');
            } else {
                document.getElementById('muteIcon').classList.remove('fa-volume-mute');
                document.getElementById('muteIcon').classList.add('fa-volume-up');
            }
        }

        function toggleMute() {
            if (isMuted) {
                audio.volume = previousVolume;
                isMuted = false;
                document.getElementById('muteIcon').classList.remove('fa-volume-mute');
                document.getElementById('muteIcon').classList.add('fa-volume-up');
                document.getElementById('volumeSlider').value = previousVolume * 100;
            } else {
                previousVolume = audio.volume;
                audio.volume = 0;
                isMuted = true;
                document.getElementById('muteIcon').classList.remove('fa-volume-up');
                document.getElementById('muteIcon').classList.add('fa-volume-mute');
                document.getElementById('volumeSlider').value = 0;
            }
        }

        // Theme Change
        function changeTheme(color1, color2) {
            document.documentElement.style.setProperty('--rgb-1', color1);
            document.documentElement.style.setProperty('--rgb-2', color2);
            
            // Add animation effect
            document.body.style.animation = 'themeChange 0.5s ease';
            setTimeout(() => {
                document.body.style.animation = '';
            }, 500);
        }

        // Open Link
        function openLink(url) {
            window.open(url, '_blank');
        }

        // Click Effects
        function setupClickEffects() {
            document.addEventListener('click', (e) => {
                const effect = document.createElement('div');
                effect.className = 'click-effect';
                effect.style.left = e.pageX - 10 + 'px';
                effect.style.top = e.pageY - 10 + 'px';
                document.body.appendChild(effect);
                
                setTimeout(() => effect.remove(), 600);
            });
        }

        // Prevent Text Selection and Context Menu
        document.addEventListener('selectstart', (e) => e.preventDefault());
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('dragstart', (e) => e.preventDefault());

        // Add theme change animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes themeChange {
                0% { filter: hue-rotate(0deg); }
                50% { filter: hue-rotate(180deg); }
                100% { filter: hue-rotate(0deg); }
            }
        `;
        document.head.appendChild(style);

        // Auto-rotate album in home section
        let albumIndex = 0;
        setInterval(() => {
            if (document.getElementById('home').classList.contains('active') && !isPlaying) {
                albumIndex = (albumIndex + 1) % songs.length;
                const song = songs[albumIndex];
                albumImage.src = song.image;
                albumTitle.textContent = song.name;
                albumDuration.textContent = song.duration;
            }
        }, 5000);
    </script>
</body>
</html>
