<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="SOKO MUSIC - Luxury Advanced Web Audio Player with Glassmorphism and RGB Effects">
    <meta name="theme-color" content="#050508">
    <title>SOKO MUSIC | Luxury Audio Experience</title>
    
    <!-- خطوط متقدمة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. المتغيرات الجذرية (Root Variables)
           ========================================= */
        :root {
            /* الألوان الأساسية */
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --secondary: #7b2cbf;
            --accent: #ff006e;
            --gold: #ffd700;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            
            /* ألوان الخلفية والزجاج */
            --bg-dark: #050508;
            --bg-darker: #020203;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-bg-hover: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(0, 212, 255, 0.3);
            --liquid-glow: rgba(0, 212, 255, 0.08);
            
            /* النصوص */
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            
            /* الأبعاد والانتقالات */
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================
           2. إعادة الضبط والأساسيات (Reset & Base)
           ========================================= */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* إخفاء الماوس الافتراضي لاستخدام المخصص */
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            line-height: 1.6;
        }

        /* =========================================
           3. مؤشر الماوس المخصص (Custom Cursor)
           ========================================= */
        .custom-cursor {
            width: 24px;
            height: 24px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            transition: transform 0.15s ease-out, background 0.2s ease, border-color 0.2s ease;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
        }

        .custom-cursor.active {
            transform: translate(-50%, -50%) scale(2.5);
            background: rgba(0, 212, 255, 0.15);
            border-color: var(--accent);
        }

        .custom-cursor.hovering {
            transform: translate(-50%, -50%) scale(1.5);
            background: rgba(0, 212, 255, 0.3);
        }

        /* =========================================
           4. خلفية الجسيمات (Particle Canvas)
           ========================================= */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.6;
        }

        /* =========================================
           5. شاشة الدخول التفاعلية (Enter Screen)
           ========================================= */
        .enter-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0a0a12 0%, #020203 100%);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 100000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease, visibility 1s ease, transform 1s ease;
        }

        .enter-screen.hidden {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.1);
            pointer-events: none;
        }

        .enter-logo-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 40px;
        }

        .enter-logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid transparent;
            background: linear-gradient(var(--bg-dark), var(--bg-dark)) padding-box,
                        linear-gradient(45deg, var(--primary), var(--secondary), var(--accent)) border-box;
            animation: logoSpin 8s linear infinite, logoPulse 3s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.3);
        }

        @keyframes logoSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(0, 212, 255, 0.3); }
            50% { box-shadow: 0 0 80px rgba(123, 44, 191, 0.5); }
        }

        .enter-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 50%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .enter-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 50px;
            text-align: center;
            max-width: 400px;
        }

        .enter-btn {
            padding: 18px 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: none;
            position: relative;
            overflow: hidden;
            transition: all var(--transition-normal);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.3);
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s ease;
        }

        .enter-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.5);
        }

        .enter-btn:hover::before {
            left: 100%;
        }

        .enter-btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* =========================================
           6. التخطيط العام (Main Layout)
           ========================================= */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .app-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .main-header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            position: relative;
            color: var(--text-primary);
            text-shadow: 3px 3px 0px var(--accent), -3px -3px 0px var(--primary);
            letter-spacing: 3px;
            display: inline-block;
        }

        .header-decoration {
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
            margin: 20px auto 0;
            border-radius: 2px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 30px;
            align-items: start;
        }

        /* =========================================
           7. الكارد الزجاجي الفاخر (Luxury Glass Card)
           ========================================= */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 35px;
            position: relative;
            overflow: hidden;
            transition: all var(--transition-normal);
            border: 1px solid var(--glass-border);
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* إطار RGB متحرك على الحواف فقط */
        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            padding: 2px;
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent), var(--primary));
            background-size: 400% 400%;
            animation: rgbBorderFlow 6s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
            opacity: 0.7;
        }

        /* تأثير السائل الشفاف بالداخل */
        .glass-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            box-shadow: inset 0 0 60px var(--liquid-glow), inset 0 0 20px rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 1;
            transition: box-shadow var(--transition-normal);
        }

        .glass-card:hover {
            transform: translateY(-10px) rotateX(2deg) rotateY(2deg);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(0, 212, 255, 0.1);
            border-color: var(--glass-border-hover);
        }

        .glass-card:hover::after {
            box-shadow: inset 0 0 80px rgba(0, 212, 255, 0.15), inset 0 0 30px rgba(255, 255, 255, 0.05);
        }

        @keyframes rgbBorderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =========================================
           8. مشغل الموسيقى الرئيسي (Main Player)
           ========================================= */
        .player-section {
            grid-column: span 5;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .album-art-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin-bottom: 35px;
        }

        .album-art-glow {
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(30px);
            opacity: 0;
            transition: opacity var(--transition-normal);
            z-index: 0;
        }

        .album-art-wrapper.playing .album-art-glow {
            opacity: 1;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }

        .album-art {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            animation: vinylSpin 12s linear infinite;
            animation-play-state: paused;
            position: relative;
            z-index: 1;
        }

        .album-art.playing {
            animation-play-state: running;
        }

        /* ثقب الأسطوانة في المنتصف */
        .album-art::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: var(--bg-dark);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes vinylSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .track-info {
            margin-bottom: 30px;
            width: 100%;
        }

        .track-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* شريط التقدم المتقدم */
        .progress-section {
            width: 100%;
            margin-bottom: 35px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            cursor: none;
            position: relative;
            overflow: hidden;
            transition: height var(--transition-fast);
        }

        .progress-bar-container:hover {
            height: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            border-radius: 10px;
            position: relative;
            transition: width 0.1s linear;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .progress-bar-container:hover .progress-fill::after {
            opacity: 1;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
        }

        /* أزرار التحكم */
        .controls-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
        }

        .ctrl-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all var(--transition-fast);
            cursor: none;
            position: relative;
            overflow: hidden;
        }

        .ctrl-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .ctrl-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--primary);
            transform: scale(1.15);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
            color: var(--primary);
        }

        .ctrl-btn:hover::before {
            opacity: 1;
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .ctrl-btn.play-pause {
            width: 75px;
            height: 75px;
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .ctrl-btn.play-pause:hover {
            color: #fff;
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.5);
        }

        .ctrl-btn.active-mode {
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
        }

        /* =========================================
           9. قائمة التشغيل (Playlist Section)
           ========================================= */
        .playlist-section {
            grid-column: span 7;
            max-height: 700px;
            display: flex;
            flex-direction: column;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .playlist-stats {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 15px;
            border-radius: 20px;
        }

        .playlist-container {
            overflow-y: auto;
            flex: 1;
            padding-left: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
            padding-right: 5px;
        }

        .playlist-container::-webkit-scrollbar {
            width: 6px;
        }

        .playlist-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .playlist-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 10px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 15px;
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            margin-bottom: 10px;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .playlist-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--primary);
            transform: scaleY(0);
            transition: transform var(--transition-fast);
        }

        .playlist-item:hover {
            background: var(--glass-bg-hover);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
        }

        .playlist-item:hover::before {
            transform: scaleY(1);
        }

        .playlist-item.active {
            background: rgba(0, 212, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .playlist-item.active::before {
            transform: scaleY(1);
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .item-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--text-muted);
            width: 25px;
            text-align: center;
            font-weight: 700;
        }

        .playlist-item.active .item-number {
            color: var(--primary);
        }

        .item-thumbnail {
            width: 50px;
            height: 50px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: transform var(--transition-fast);
        }

        .playlist-item:hover .item-thumbnail {
            transform: scale(1.1);
            border-color: var(--primary);
        }

        .item-details {
            flex: 1;
            min-width: 0; /* لمنع تجاوز النص */
        }

        .item-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-artist {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .item-duration {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-left: 15px;
        }

        .item-play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            cursor: none;
            opacity: 0;
            transform: scale(0.8);
        }

        .playlist-item:hover .item-play-btn {
            opacity: 1;
            transform: scale(1);
        }

        .item-play-btn:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        /* =========================================
           10. المعادل الصوتي (Equalizer Section)
           ========================================= */
        .equalizer-section {
            grid-column: span 12;
            margin-top: 10px;
        }

        .eq-bands-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 200px;
            padding: 20px 10px;
            gap: 8px;
        }

        .eq-band {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .eq-slider-wrapper {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* تخصيص شريط التمرير العمودي للمعالج */
        .eq-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 140px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            outline: none;
            transform: rotate(-90deg);
            cursor: none;
        }

        .eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--primary);
            border-radius: 50%;
            cursor: none;
            box-shadow: 0 0 10px var(--primary);
            transition: transform var(--transition-fast);
        }

        .eq-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .eq-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .eq-value {
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 700;
        }

        /* =========================================
           11. نظام الإشعارات (Toast Notifications)
           ========================================= */
        .toast-container {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100001;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none; /* للسماح بالنقر من خلاله */
        }

        .toast {
            background: rgba(5, 5, 8, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-right: 4px solid var(--primary);
            color: var(--text-primary);
            padding: 16px 28px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: 15px;
            animation: toastSlideDown 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
            min-width: 300px;
        }

        .toast.success { border-right-color: var(--success); }
        .toast.success i { color: var(--success); }
        
        .toast.error { border-right-color: var(--danger); }
        .toast.error i { color: var(--danger); }
        
        .toast.warning { border-right-color: var(--warning); }
        .toast.warning i { color: var(--warning); }

        .toast i {
            font-size: 1.3rem;
        }

        .toast-message {
            font-size: 0.95rem;
            font-weight: 600;
        }

        @keyframes toastSlideDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes toastFadeOut {
            to { transform: translateY(-20px); opacity: 0; }
        }

        /* =========================================
           12. الاستجابة للشاشات (Responsive Design)
           ========================================= */
        @media (max-width: 1200px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
            .player-section, .playlist-section, .equalizer-section {
                grid-column: span 1;
            }
            .playlist-section {
                max-height: 500px;
            }
        }

        @media (max-width: 768px) {
            .custom-cursor { display: none; }
            *, *::before, *::after { cursor: auto; }
            
            .enter-title { font-size: 2.2rem; }
            .glitch-title { font-size: 2rem; }
            
            .album-art-wrapper {
                width: 200px;
                height: 200px;
            }
            
            .controls-wrapper {

            }
            
            .ctrl-btn {

                height: 45px;
                font-size: 1rem;
            }
            
            .ctrl-btn.play-pause {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }

            .eq-bands-container {
                overflow-x: auto;
                justify-content: flex-start;
                padding-bottom: 20px;
            }
            
            .eq-band {
                min-width: 50px;
            }
        }

        /* =========================================
           13. تأثيرات إضافية (Utility Animations)
           ========================================= */
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .slide-up { animation: slideUp 0.5s ease forwards; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* منع تحديد النص */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;

    <script>
        /**
         * ==========================================
         * SOKO MUSIC ENGINE - Advanced Audio Player
         * ==========================================
         * هذا السكربت يحتوي على كل المنطق البرمجي للموقع
         * مقسم إلى فئات (Classes) لتنظيم الكود وجعله قابلاً للصيانة.
         */

        // ==========================================
        // 1. بيانات الأغاني (Playlist Data)
        // ==========================================
        const TRACKS_DATA = [
            { id: 1, title: "SOKO Intro", artist: "SOKO Original", src: "1.mp3", img: "1.jpg", duration: "03:45" },
            { id: 2, title: "Midnight Dreams", artist: "SOKO Production", src: "2.mp3", img: "2.jpg", duration: "04:12" },
            { id: 3, title: "Neon Lights", artist: "Cyber Wave", src: "3.mp3", img: "3.jpg", duration: "03:28" },
            { id: 4, title: "Deep Focus", artist: "Ambient Mind", src: "4.mp3", img: "4.jpg", duration: "05:01" },
            { id: 5, title: "Retro Future", artist: "Synth Master", src: "5.mp3", img: "5.jpg", duration: "03:55" },
            { id: 6, title: "Urban Jungle", artist: "Beat Maker", src: "6.mp3", img: "6.jpg", duration: "04:30" },
            { id: 7, title: "Crystal Clear", artist: "Audio Phile", src: "7.mp3", img: "7.jpg", duration: "03:15" },
            { id: 8, title: "Bass Drop", artist: "DJ SOKO", src: "8.mp3", img: "8.jpg", duration: "04:45" },
            { id: 9, title: "Ethereal", artist: "Space Sound", src: "9.mp3", img: "9.jpg", duration: "03:38" },
            { id: 10, title: "Final Horizon", artist: "Epic Scores", src: "10.mp3", img: "10.jpg", duration: "04:20" }
        ];

        // ==========================================
        // 2. فئة إدارة التخزين المحلي (Storage Manager)
        // ==========================================
        class StorageManager {
            static save(key, value) {
                try {
                    localStorage.setItem(`soko_${key}`, JSON.stringify(value));
                } catch (e) {
                    console.warn("Local Storage غير متاح");
                }
            }

            static load(key, defaultValue = null) {
                try {
                    const item = localStorage.getItem(`soko_${key}`);
                    return item ? JSON.parse(item) : defaultValue;
                } catch (e) {
                    return defaultValue;
                }
            }

            static clear() {
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('soko_')) {
                        localStorage.removeItem(key);
                    }
                });
            }
        }

        // ==========================================
        // 3. فئة واجهة المستخدم والإشعارات (UI Manager)
        // ==========================================
        class UIManager {
            static showToast(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle'
                };

                toast.innerHTML = `
                    <i class="fas ${icons[type] || icons.success}"></i>
                    <span class="toast-message">${message}</span>
                `;
                
                container.appendChild(toast);

                // إزالة الإشعار بعد 3.5 ثانية
                setTimeout(() => {
                    toast.style.animation = 'toastFadeOut 0.4s ease forwards';
                    setTimeout(() => {
                        if (toast.parentNode) {
                            toast.parentNode.removeChild(toast);
                        }
                    }, 400);
                }, 3500);
            }

            static formatTime(seconds) {
                if (isNaN(seconds) || seconds === 0) return "0:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }
        }

        // ==========================================
        // 4. فئة مشغل الصوت الأساسي (Audio Player Engine)
        // ==========================================
        class AudioPlayer {
            constructor() {
                this.audio = document.getElementById('audioElement');
                this.tracks = TRACKS_DATA;
                this.currentIndex = StorageManager.load('currentTrackIndex', 0);
                this.isPlaying = false;
                this.isRepeat = StorageManager.load('isRepeat', false);
                this.isShuffle = StorageManager.load('isShuffle', false);
                this.volume = StorageManager.load('volume', 0.8);
                
                this.audio.volume = this.volume;
                this.setupEventListeners();
                this.updateUIState();
            }

            setupEventListeners() {
                // تحديث شريط التقدم
                this.audio.addEventListener('timeupdate', () => {
                    if (this.audio.duration) {
                        const percent = (this.audio.currentTime / this.audio.duration) * 100;
                        document.getElementById('progressFill').style.width = `${percent}%`;
                        document.getElementById('currentTime').textContent = UIManager.formatTime(this.audio.currentTime);
                    }
                });

                // عند تحميل بيانات الأغنية
                this.audio.addEventListener('loadedmetadata', () => {
                    document.getElementById('totalDuration').textContent = UIManager.formatTime(this.audio.duration);
                });

                // عند انتهاء الأغنية
                this.audio.addEventListener('ended', () => {
                    if (this.isRepeat) {
                        this.audio.currentTime = 0;
                        this.play();
                    } else {
                        this.next();
                    }
                });

                // معالجة الأخطاء (مهم جداً لعدم ظهور Alert)
                this.audio.addEventListener('error', (e) => {
                    console.error("Audio Error:", e);
                    UIManager.showToast(`تعذر تحميل: ${this.tracks[this.currentIndex].src}`, 'error');
                    // الانتقال للتالي تلقائياً بعد خطأ
                    setTimeout(() => this.next(), 2000);
                });

                // النقر على شريط التقدم
                document.getElementById('progressBarContainer').addEventListener('click', (e) => {
                    if (this.audio.duration) {
                        const rect = e.currentTarget.getBoundingClientRect();
                        // حساب النسبة بناءً على اتجاه الصفحة (RTL)
                        const clickX = e.clientX - rect.left;
                        const percent = clickX / rect.width;
                        this.audio.currentTime = percent * this.audio.duration;
                    }
                });
            }

            loadTrack(index) {
                if (index < 0 || index >= this.tracks.length) return;
                
                this.currentIndex = index;
                const track = this.tracks[index];
                
                this.audio.src = track.src;
                document.getElementById('trackTitle').textContent = track.title;
                document.getElementById('trackArtist').textContent = track.artist;
                
                const imgEl = document.getElementById('albumArt');
                imgEl.src = track.img;
                imgEl.onerror = function() { 
                    this.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iIzIyMiIvPjxjaXJjbGUgY3g9IjEwMCIgY3k9IjEwMCIgcj0iODAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzQ0NCIgc3Ryb2tlLXdpZHRoPSI0Ii8+PC9zdmc+'; 
                };

                // تحديث القائمة
                this.updatePlaylistActiveState();
                StorageManager.save('currentTrackIndex', this.currentIndex);
            }

            play() {
                const playPromise = this.audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        this.isPlaying = true;
                        this.updatePlayButton();
                        document.getElementById('albumArtWrapper').classList.add('playing');
                        document.getElementById('albumArt').classList.add('playing');
                    }).catch(error => {
                        console.error("Playback failed:", error);
                        UIManager.showToast('تعذر تشغيل الملف. تأكد من وجوده في المجلد.', 'error');
                    });
                }
            }

            pause() {
                this.audio.pause();
                this.isPlaying = false;
                this.updatePlayButton();
                document.getElementById('albumArtWrapper').classList.remove('playing');
                document.getElementById('albumArt').classList.remove('playing');
            }

            togglePlay() {
                if (this.isPlaying) {
                    this.pause();
                } else {
                    this.play();
                }
            }

            next() {
                let nextIndex;
                if (this.isShuffle) {
                    nextIndex = Math.floor(Math.random() * this.tracks.length);
                } else {
                    nextIndex = (this.currentIndex + 1) % this.tracks.length;
                }
                this.loadTrack(nextIndex);
                if (this.isPlaying) this.play();
            }

            previous() {
                let prevIndex = (this.currentIndex - 1 + this.tracks.length) % this.tracks.length;
                this.loadTrack(prevIndex);
                if (this.isPlaying) this.play();
            }

            playSpecific(index) {
                this.loadTrack(index);
                this.play();
            }

            toggleRepeat() {
                this.isRepeat = !this.isRepeat;
                StorageManager.save('isRepeat', this.isRepeat);
                this.updateUIState();
                UIManager.showToast(this.isRepeat ? 'تم تفعيل تكرار الأغنية' : 'تم إيقاف التكرار', 'success');
            }

            toggleShuffle() {
                this.isShuffle = !this.isShuffle;
                StorageManager.save('isShuffle', this.isShuffle);
                this.updateUIState();
                UIManager.showToast(this.isShuffle ? 'تم تفعيل التشغيل العشوائي' : 'تم إيقاف العشوائي', 'success');
            }

            updatePlayButton() {
                const btn = document.getElementById('playPauseBtn');
                btn.innerHTML = this.isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            }

            updateUIState() {
                document.getElementById('repeatBtn').classList.toggle('active-mode', this.isRepeat);
                document.getElementById('shuffleBtn').classList.toggle('active-mode', this.isShuffle);
                this.updatePlayButton();
            }

            updatePlaylistActiveState() {
                const items = document.querySelectorAll('.playlist-item');
                items.forEach((item, index) => {
                    if (index === this.currentIndex) {
                        item.classList.add('active');
                        item.querySelector('.item-play-btn').innerHTML = '<i class="fas fa-pause"></i>';
                    } else {
                        item.classList.remove('active');
                        item.querySelector('.item-play-btn').innerHTML = '<i class="fas fa-play"></i>';
                    }
                });
            }
        }

        // ==========================================
        // 5. فئة نظام الجسيمات (Particle System)
        // ==========================================
        class ParticleSystem {
            constructor() {
                this.canvas = document.getElementById('particle-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.mouse = { x: null, y: null, radius: 150 };
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.x;
                    this.mouse.y = e.y;
                });

                this.init();
                this.animate();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.init();
            }

            init() {
                this.particles = [];
                const numberOfParticles = (this.canvas.width * this.canvas.height) / 12000;
                for (let i = 0; i < numberOfParticles; i++) {
                    const size = (Math.random() * 2) + 1;
                    const x = Math.random() * (this.canvas.width - size * 2) + size * 2;
                    const y = Math.random() * (this.canvas.height - size * 2) + size * 2;
                    const directionX = (Math.random() * 0.4) - 0.2;
                    const directionY = (Math.random() * 0.4) - 0.2;
                    this.particles.push({ x, y, directionX, directionY, size, color: '#00d4ff' });
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = 0; i < this.particles.length; i++) {
                    this.updateParticle(this.particles[i]);
                    this.drawParticle(this.particles[i]);
                    this.connectParticles(i);
                }
            }

            updateParticle(p) {
                if (p.x > this.canvas.width || p.x < 0) p.directionX = -p.directionX;
                if (p.y > this.canvas.height || p.y < 0) p.directionY = -p.directionY;

                // التفاعل مع الماوس
                const dx = this.mouse.x - p.x;
                const dy = this.mouse.y - p.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < this.mouse.radius + p.size) {
                    if (this.mouse.x < p.x && p.x < this.canvas.width - p.size * 10) p.x += 1.5;
                    if (this.mouse.x > p.x && p.x > p.size * 10) p.x -= 1.5;
                    if (this.mouse.y < p.y && p.y < this.canvas.height - p.size * 10) p.y += 1.5;
                    if (this.mouse.y > p.y && p.y > p.size * 10) p.y -= 1.5;
                }

                p.x += p.directionX;
                p.y += p.directionY;
            }

            drawParticle(p) {
                this.ctx.beginPath();
                this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2, false);
                this.ctx.fillStyle = p.color;
                this.ctx.fill();
            }

            connectParticles(index) {
                for (let j = index; j < this.particles.length; j++) {
                    const p1 = this.particles[index];
                    const p2 = this.particles[j];
                    const distance = ((p1.x - p2.x) ** 2) + ((p1.y - p2.y) ** 2);
                    
                    if (distance < (this.canvas.width / 7) * (this.canvas.height / 7)) {
                        const opacity = 1 - (distance / 25000);
                        this.ctx.strokeStyle = `rgba(0, 212, 255, ${opacity * 0.4})`;
                        this.ctx.lineWidth = 1;
                        this.ctx.beginPath();
                        this.ctx.moveTo(p1.x, p1.y);
                        this.ctx.lineTo(p2.x, p2.y);
                        this.ctx.stroke();
                    }
                }
            }
        }

        // ==========================================
        // 6. فئة المعادل الصوتي (Equalizer)
        // ==========================================
        class Equalizer {
            constructor() {
                this.bands = ['60Hz', '170Hz', '310Hz', '600Hz', '1kHz', '3kHz', '6kHz', '12kHz', '14kHz', '16kHz'];
                this.container = document.getElementById('eqContainer');
                this.render();
            }

            render() {
                this.container.innerHTML = '';
                this.bands.forEach((freq, index) => {
                    const band = document.createElement('div');
                    band.className = 'eq-band';
                    
                    const savedValue = StorageManager.load(`eq_${freq}`, 0);
                    
                    band.innerHTML = `
                        <span class="eq-value" id="eq-val-${index}">${savedValue > 0 ? '+' : ''}${savedValue}dB</span>
                        <div class="eq-slider-wrapper">
                            <input type="range" min="-12" max="12" value="${savedValue}" class="eq-slider" 
                                   oninput="Equalizer.update(${index}, '${freq}', this.value)">
                        </div>
                        <span class="eq-label">${freq}</span>
                    `;
                    this.container.appendChild(band);
                });
            }

            static update(index, freq, value) {
                document.getElementById(`eq-val-${index}`).textContent = `${value > 0 ? '+' : ''}${value}dB`;
                StorageManager.save(`eq_${freq}`, parseInt(value));
                // ملاحظة: لتطبيق هذا فعلياً على الصوت، نحتاج إلى Web Audio API Filter Nodes
                // هذا النموذج يحاكي الواجهة ويحفظ التفضيلات
            }
        }

        // ==========================================
        // 7. الفئة الرئيسية للتطبيق (Main App Controller)
        // ==========================================
        class App {
            static player = null;
            static particles = null;

            static initialize() {
                // إخفاء شاشة الدخول
                document.getElementById('enterScreen').classList.add('hidden');
                
                // إظهار الحاوية الرئيسية
                setTimeout(() => {
                    document.getElementById('appContainer').classList.add('visible');
                }, 300);

                // تهيئة المكونات
                this.player = new AudioPlayer();
                this.particles = new ParticleSystem();
                new Equalizer();

                // بناء قائمة التشغيل
                this.renderPlaylist();
                
                // تحميل آخر أغنية
                this.player.loadTrack(this.player.currentIndex);
                
                UIManager.showToast('مرحباً بك في SOKO MUSIC', 'success');
            }

            static renderPlaylist() {
                const container = document.getElementById('playlistContainer');
                document.getElementById('playlistStats').textContent = `${TRACKS_DATA.length} أغنية`;
                
                container.innerHTML = TRACKS_DATA.map((track, index) => `
                    <div class="playlist-item" onclick="App.player.playSpecific(${index})">
                        <span class="item-number">${index + 1}</span>
                        <img src="${track.img}" alt="${track.title}" class="item-thumbnail" 
                             onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MCA1MCI+PHJlY3Qgd2lkdGg9IjUwIiBoZWlnaHQ9IjUwIiBmaWxsPSIjMzMiLz48L3N2Zz4='">
                        <div class="item-details">
                            <div class="item-title">${track.title}</div>
                            <div class="item-artist">${track.artist}</div>
                        </div>
                        <span class="item-duration">${track.duration}</span>
                        <button class="item-play-btn">
                            <i class="fas fa-play"></i>
                        </button>
                    </div>
                `).join('');
            }
        }

        // ==========================================
        // 8. تهيئة مؤشر الماوس المخصص (Custom Cursor Logic)
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const cursor = document.getElementById('customCursor');
            
            document.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });

            document.addEventListener('mousedown', () => cursor.classList.add('active'));
            document.addEventListener('mouseup', () => cursor.classList.remove('active'));

            // إضافة تأثير hover للعناصر التفاعلية
            const interactiveElements = document.querySelectorAll('button, a, .playlist-item, .ctrl-btn, input[type="range"]');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('hovering'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('hovering'));
            });

            // منع القوائم الافتراضية وسحب الصور
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
        });

        // اختصارات لوحة المفاتيح
        document.addEventListener('keydown', (e) => {
            if (!App.player) return;
            
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    App.player.togglePlay();
                    break;
                case 'ArrowRight':
                    App.player.next();
                    break;
                case 'ArrowLeft':
                    App.player.previous();
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    if (App.player.audio.volume < 1) {
                        App.player.audio.volume = Math.min(1, App.player.audio.volume + 0.1);
                        UIManager.showToast(`الصوت: ${Math.round(App.player.audio.volume * 100)}%`, 'success');
                    }
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    if (App.player.audio.volume > 0) {
                        App.player.audio.volume = Math.max(0, App.player.audio.volume - 0.1);
                        UIManager.showToast(`الصوت: ${Math.round(App.player.audio.volume * 100)}%`, 'warning');
                    }
                    break;
            }
        });

    </script>
</body>
</html>
